services:
  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
      - ${SSH_KEY_DIR:-./ssh}:/root/.ssh:ro
    env_file:
      - .env
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python bot.py"
    restart: unless-stopped
